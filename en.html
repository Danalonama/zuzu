  /* selected-day hero */

  .card{display:flex;align-items:center;gap:22px;background:var(--card);
        border:none;border-radius:14px;padding:16px 22px;text-decoration:none;color:var(--ink);
        transition:background .28s cubic-bezier(.16,1,.3,1),color .28s,transform .28s,box-shadow .28s}
  .card:hover{transform:translateY(-3px)}
  /* the card is a plain container; its one real link (.cardlink) stretches over the whole card via ::after,
     and the calendar button sits above that layer — valid HTML (no button inside a link), whole card still clickable */
  .card{position:relative}
  .card .cardlink{color:inherit;text-decoration:none}
  .card .cardlink::after{content:"";position:absolute;inset:0;border-radius:inherit}
  .card .cardlink:focus-visible{outline:none}
  .card .cardlink:focus-visible::after{outline:2.5px solid var(--accent);outline-offset:2px}
  .card .calbtn{position:relative;z-index:1}
  .card .thumb{flex:none;width:76px;height:76px;aspect-ratio:1;background:var(--ink);position:relative;overflow:hidden}

  .card .ti,.card .meta{text-align:left}
  .card .t{flex:none;width:92px;align-self:flex-start;margin-top:3px;text-align:start;
           display:flex;flex-direction:column;gap:5px}
  .card .t .tt{font-size:clamp(1.5rem,2.2vw,1.9rem);font-weight:800;color:var(--accent);
           font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
  .card .t .td{font-size:.77rem;color:var(--muted);line-height:1.3;white-space:nowrap}
  .card .main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start}
  .card .ti{font-weight:700;font-size:1.02rem;margin:0;line-height:1.25;text-wrap:pretty}
  .card .host{font-size:.82rem;color:var(--ink);font-weight:600}
  .card .host b{font-weight:600}
  .card .host::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
        background:var(--accent);margin-inline-end:7px;vertical-align:middle}
  .card .info{display:flex;align-items:baseline;justify-content:flex-start;gap:4px 18px;flex-wrap:wrap}
  .card .labels{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.72rem;letter-spacing:.03em;color:var(--ink)}
  .card .labels span{display:inline-flex;align-items:center;gap:6px}
  .card .labels span::before{content:"/";color:var(--accent);font-weight:700}
  .card .labels span:first-child::before{display:none}
  .card .labels span.fmt{color:var(--muted)}
  .card .labels span.fmt::before{content:"◇";color:var(--muted);font-weight:400}
  .card .meta{font-size:.77rem;color:var(--muted);line-height:1.5;white-space:nowrap}
  .card .price{font-size:.77rem;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .end{flex:none;display:flex;flex-direction:row;align-items:center;gap:16px}
  .card .more{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;white-space:nowrap}
  .card .calbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.72rem;font-weight:700;
        color:var(--muted);background:none;border:1px solid var(--hair);border-radius:999px;
        padding:5px 11px;cursor:pointer;white-space:nowrap;
        transition:background .2s,color .2s,border-color .2s}
  .card .calbtn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .card .calbtn svg{width:13px;height:13px;flex:none}
  body[data-cards="invert"] .card:hover .calbtn{border-color:rgba(255,255,255,.32);color:rgba(255,255,255,.7)}
  body[data-cards="invert"] .card:hover .calbtn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .calmenu{position:absolute;z-index:120;background:var(--card,#fff);border:1px solid var(--hair);
        border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.16);padding:6px;min-width:230px;
        display:flex;flex-direction:column;gap:2px;animation:calpop .14s cubic-bezier(.16,1,.3,1)}
  @keyframes calpop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  .calmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;
        font:inherit;font-size:.86rem;font-weight:600;color:var(--ink);background:none;border:none;
        border-radius:8px;padding:10px 11px;cursor:pointer;transition:background .15s}
  .calmenu button:hover{background:rgba(251,77,30,.1);color:var(--accent)}
  .calmenu button svg{width:17px;height:17px;flex:none;color:var(--accent)}
  .card .more .ar{transition:transform .15s}
  .card .more .ar.wa{display:inline-flex;width:18px;height:18px;color:#25D366}
  .card .more .ar.wa svg{width:100%;height:100%}
  .card .more .nolink{color:var(--muted);font-weight:600}
  @media(max-width:400px){.card .end{flex-wrap:wrap;row-gap:10px}}
  body[data-cards="invert"] .card.wacard:hover .more .ar.wa{color:#4ee584}
  /* invert hover */
  body[data-cards="invert"] .card:hover{background:var(--ink);color:var(--bg)}
  body[data-cards="invert"] .card:hover .thumb{background:var(--bg)}
  body[data-cards="invert"] .card:hover .thumb .bw{opacity:0}
  body[data-cards="invert"] .card:hover .thumb .bk{opacity:1}
  body[data-cards="invert"] .card:hover .meta,body[data-cards="invert"] .card:hover .price{color:rgba(255,255,255,.55)}
  body[data-cards="invert"] .card:hover .labels{color:var(--bg)}
  body[data-cards="invert"] .card:hover .more .ar{transform:translateX(5px)}
  /* outline hover */
  body[data-cards="outline"] .card:hover{border-color:var(--accent)}
  body[data-cards="outline"] .card:hover .more{color:color-mix(in srgb,var(--accent) 85%,#000)}
  body[data-cards="outline"] .card:hover .more .ar{transform:translateX(5px)}
  /* minimal: no thumb */
  body[data-cards="minimal"] .card .thumb{display:none}
  body[data-cards="minimal"] .card:hover{border-color:var(--accent)}
  body[data-cards="minimal"] .card:hover .more{color:color-mix(in srgb,var(--accent) 85%,#000)}
  body[data-cards="minimal"] .card:hover .more .ar{transform:translateX(5px)}
  @media(max-width:680px){
    .card{flex-wrap:wrap;gap:8px 18px;padding:16px 16px}

    .card .t .tt{font-size:1.7rem}
    .card .t .td{font-size:.85rem}
    .card .main{flex:1 1 60%;align-items:stretch}
    .card .ti{font-size:1.12rem}
    .card .host{font-size:.9rem}
    .card .info{align-items:stretch}
    .card .labels{font-size:.82rem;justify-content:flex-start}
    .card .meta{font-size:.85rem;white-space:normal}
    .card .more{font-size:.92rem}
    .card .info{flex-direction:column;gap:5px}
    .card .end{flex:1 1 100%;justify-content:flex-start;
               border-top:1px solid var(--hair);padding-top:10px;margin-top:2px}
  }
  .empty{text-align:start;color:var(--muted);font-weight:300;padding:50px 0;font-size:1.1rem}

  /* loading skeleton — shown while the live list is still coming in */
  .zloading{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:400;font-size:.95rem;padding:6px 2px 14px}

         display:inline-block;animation:zspin .7s linear infinite}
  @keyframes zspin{to{transform:rotate(360deg)}}
  .zskel{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:20px 22px;margin-bottom:12px}
  .zskel-t{height:15px;width:52%;border-radius:3px;margin-bottom:11px;
           background:linear-gradient(90deg,#e9edef 25%,#f4f7f8 37%,#e9edef 63%);background-size:400% 100%;animation:zshim 1.3s ease infinite}
  .zskel-s{height:11px;width:34%;border-radius:3px;
           background:linear-gradient(90deg,#e9edef 25%,#f4f7f8 37%,#e9edef 63%);background-size:400% 100%;animation:zshim 1.3s ease infinite}
  @keyframes zshim{0%{background-position:100% 0}100%{background-position:-100% 0}}

  /* calendar — mono grid */
  .calbar{display:flex;align-items:center;justify-content:space-between;margin:30px 0 18px}
  .calbar h2{margin:0;font-size:clamp(1.5rem,3vw,2.2rem);font-weight:900;letter-spacing:-.03em;text-transform:lowercase}
  .calbar button{background:var(--bg);border:1px solid var(--ink);width:44px;height:44px;border-radius:0;
                 font-size:1.1rem;cursor:pointer;font-family:inherit;transition:.15s}
  .calbar button:hover{background:var(--ink);color:var(--bg)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border:none;background:var(--card);
           border-radius:4px;overflow:hidden;box-shadow:0 2px 10px rgba(20,40,60,.05),0 12px 28px rgba(20,40,60,.06)}
  .dow{font-size:.6rem;color:var(--muted);text-align:start;background:var(--card);padding:8px;font-weight:700;
       letter-spacing:.1em;text-transform:lowercase;border-inline-start:1px solid var(--hair);border-bottom:1px solid var(--hair)}
  .dow:first-child{border-inline-start:none}
  .cell{background:var(--card);border:none;border-inline-start:1px solid var(--hair);border-bottom:1px solid var(--hair);
        min-height:112px;padding:7px 8px;cursor:pointer;overflow:hidden;transition:background .12s}
  .cell:nth-child(7n+1){border-inline-start:none}
  .cell:hover{background:#fafafa}
  .cell.out .dn{color:#767676} /* a11y: was #cfcfcf (1.6:1) → 4.5:1 */
  .cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
  .cell .dn{font-size:.8rem;color:var(--ink);font-weight:700;margin-bottom:5px;line-height:22px}

                  border-radius:50%;background:var(--accent);color:#fff}

         text-overflow:ellipsis;font-weight:500;color:var(--ink)}

  .dayDetail{margin-top:30px}

  footer{border-top:1px solid var(--ink);margin-top:60px}

  #tweaks .seg button:first-child{border-inline-start:none}
  #tweaks .seg button.on{background:var(--ink);color:var(--bg)}
  #tweaks .sw{display:flex;gap:9px}

  /* — motion — */
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}

                animation:fadeUp .95s cubic-bezier(.16,1,.3,1) forwards}

    @keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
    body:not([data-motion="off"]) .disc{animation:floaty 7s ease-in-out infinite}
    body[data-motion="lively"] .disc{animation:floaty 4.4s ease-in-out infinite}
    body:not([data-motion="off"]) .tile img{animation:drift 9s ease-in-out infinite}

    body[data-motion="off"] .bar .field{opacity:1;transform:none;animation:none}
    body[data-motion="off"] .rv{opacity:1;transform:none;animation:none}
  }

window.zuzuA11y=(function(){
  const FOC='a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  let box=null, back=null;
  function items(){ return box?[...box.querySelectorAll(FOC)].filter(el=>el.offsetParent!==null||el===document.activeElement):[]; }
  document.addEventListener("keydown",e=>{
    if(e.key!=="Tab"||!box) return;
    const f=items(); if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
    else if(!box.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
  });
  // Enter / Space activate non-native buttons (spans/divs with role="button")
  document.addEventListener("keydown",e=>{
    const t=e.target;
    if(!(t instanceof Element)||t.getAttribute("role")!=="button"||/^(BUTTON|A|INPUT)$/.test(t.tagName)) return;
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); t.click(); }
  });
  return {
    trap(el,returnTo){
      back=returnTo||(document.activeElement instanceof HTMLElement?document.activeElement:null); box=el;
      setTimeout(()=>{ const f=items(); const first=f.find(x=>!x.matches(".modal-x,.fsX"))||f[0]; if(first) first.focus(); },30);
    },
    release(){ box=null; const b=back; back=null; if(b&&document.contains(b)) b.focus(); }
  };
})();

function icsDownload(ev){
  const pad=n=>String(n).padStart(2,"0");
  const start=new Date(ev.date+"T"+((ev.time||"00:00")));
  // multi-session formats (course/workshop/retreat) default to longer blocks
  const longFmt=["Course","Workshop","Retreat"].includes(ev.format);
  let end=new Date(start.getTime()+(longFmt?120:90)*60000);
  if(ev.timeEnd){ const te=new Date(ev.date+"T"+ev.timeEnd); if(te>start) end=te; }
  const fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
  const esc=s=>(s||"").replace(/([,;\\])/g,"\\$1").replace(/\r?\n/g,"\\n");
  const desc=[ev.host?"with "+ev.host:"",ev.url].filter(Boolean).join("\n");
  const lines=[
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//zuzu.today//calendar//HE","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VEVENT",
    "UID:"+fmt(start)+"-"+Math.random().toString(36).slice(2,8)+"@zuzu.today",
    "DTSTAMP:"+fmt(new Date()),
    "DTSTART:"+fmt(start),
    "DTEND:"+fmt(end),
    "SUMMARY:"+esc(ev.title),
    ev.loc?"LOCATION:"+esc(ev.loc):"",
    desc?"DESCRIPTION:"+esc(desc):"",
    ev.url?"URL:"+esc(ev.url):"",
    "END:VEVENT","END:VCALENDAR"
  ].filter(Boolean);
  const blob=new Blob([lines.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=(ev.title||"event").replace(/[^\w\u0590-\u05FF]+/g,"-").replace(/^-|-$/g,"").slice(0,40)+".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function gcalUrl(ev){
  const pad=n=>String(n).padStart(2,"0");
  const start=new Date(ev.date+"T"+((ev.time||"00:00")));
  const longFmt=["Course","Workshop","Retreat"].includes(ev.format);
  let end=new Date(start.getTime()+(longFmt?120:90)*60000);
  if(ev.timeEnd){ const te=new Date(ev.date+"T"+ev.timeEnd); if(te>start) end=te; }
  const fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
  const desc=[ev.host?"with "+ev.host:"",ev.url].filter(Boolean).join("\n");

function dedupeEvents(){
  // collapse events sharing date+time+venue (keeps the first, drops later copies
  // even if their titles differ slightly, e.g. an added "(עד 22:00)")
  const seen=new Set(),out=[];
  for(const e of EVENTS){
    const k=(e.date||"")+"|"+(e.time||"")+"|"+((e.venue||"").trim());
    if(seen.has(k))continue;
    seen.add(k);out.push(e);
  }
  if(out.length!==EVENTS.length)EVENTS.length=0,EVENTS.push(...out);
}

}

/* ---------- timeline (day ruler) view ---------- */
const RULER_DAYS=90;   // the day ruler shows at most this many days ahead; later events are in search + calendar
function timelineDays(){
  let maxIso=iso(TODAY);
  for(const e of EVENTS){ if(e.date>maxIso) maxIso=e.date; }
  const end=dateOf({date:maxIso});
  const days=[]; const d=new Date(TODAY); let guard=0;
  while(d<=end && guard++<RULER_DAYS){ days.push(new Date(d)); d.setDate(d.getDate()+1); }
  return days;
}
function dayCount(key){ let n=0; for(const e of EVENTS){ if(e.date===key && passFilters(e)) n++; } return n; }
function heroLabel(dt){
  const diff=Math.round((dt-TODAY)/864e5);
  const full=`${HEB_DAYS[dt.getDay()]} · ${dt.getDate()} ${SHORT_MONTHS[dt.getMonth()]}`;
  if(diff===0) return ["Today", full, true];
  if(diff===1) return ["Tomorrow", full, false];
  return [HEB_DAYS[dt.getDay()], `${dt.getDate()} ${SHORT_MONTHS[dt.getMonth()]}`, false];
}
function renderTimeline(){
  dedupeEvents();
  const ruler=document.getElementById("ruler");
  const hero=document.getElementById("tlHero");
  const list=document.getElementById("list");
  const wrap=document.getElementById("rulerWrap");

  // search mode → flat results across all upcoming days; hide the ruler
  if(state.q){
    wrap.style.display="none"; hero.style.display="none";
    const evs=EVENTS.filter(e=>passFilters(e)&&inWhen(e)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time<b.time?-1:1));
    setCount(evs.length);
    if(window.ZUZU_LOADING){ list.innerHTML=loadingHtml(4); return; }
    if(!evs.length){ list.innerHTML='<div class="empty">No events found. Try another word.</div>'; return; }
    const perDay={}; evs.forEach(e=>perDay[e.date]=(perDay[e.date]||0)+1);
    let h="",last="";
    for(const e of evs){
      if(e.date!==last){ h+=`<div class="day"><h2>${fmtDay(dateOf(e))}</h2><span class="dc">${evN(perDay[e.date],true)}</span></div>`; last=e.date; }
      h+=cardHtml(e);
    }
    list.innerHTML=h; reveal(list,".day,.card,.empty",70,420); return;
  }

  // "week" shortcut → flat results across the next 7 days (same rendering as search mode)
  if(state.when==="week"){
    wrap.style.display="none"; hero.style.display="none";
    const evs=EVENTS.filter(e=>passFilters(e)&&inWhen(e)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.time<b.time?-1:1));
    setCount(evs.length);
    if(window.ZUZU_LOADING){ list.innerHTML=loadingHtml(4); return; }
    if(!evs.length){ list.innerHTML='<div class="empty">No events this week.</div>'; return; }
    const perDay={}; evs.forEach(e=>perDay[e.date]=(perDay[e.date]||0)+1);
    let h="",last="";
    for(const e of evs){
      if(e.date!==last){ h+=`<div class="day"><h2>${fmtDay(dateOf(e))}</h2><span class="dc">${evN(perDay[e.date],true)}</span></div>`; last=e.date; }
      h+=cardHtml(e);
    }
    list.innerHTML=h; reveal(list,".day,.card,.empty",70,420); return;
  }

  wrap.style.display=""; hero.style.display="";

  // "today"/"tomorrow" shortcuts → jump the ruler to that specific day
  if(state.when==="tonight") state.selDate=iso(TODAY);
  else if(state.when==="tomorrow"){ const t=new Date(TODAY); t.setDate(t.getDate()+1); state.selDate=iso(t); }

  const days=timelineDays();
  if(!days.some(d=>iso(d)===state.selDate)) state.selDate=iso(TODAY);

  let rh="";
  days.forEach(d=>{
    const key=iso(d), c=dayCount(key);
    const sel=key===state.selDate, today=+d===+TODAY;
    const diff=Math.round((d-TODAY)/864e5);
    const cls=["tick"]; if(c>0)cls.push("has"); if(today)cls.push("today"); if(sel)cls.push("sel");
    const top=d.getDate(), topCls="dnum";
    const dowLabel = today ? "Today" : (diff===1 ? "Tmrw" : SHORT_DAYS[d.getDay()]);
    const tickLbl=`${today?"Today, ":diff===1?"Tomorrow, ":""}${HEB_DAYS[d.getDay()]} ${d.getDate()} ${HEB_MONTHS[d.getMonth()]}, ${c?evN(c):"no events"}`;
    rh+=`<button type="button" class="${cls.join(" ")}" data-day="${key}" title="${evN(c)}" aria-label="${tickLbl}" aria-pressed="${sel}"${today?' aria-current="date"':""}>`+
        `<span class="${topCls}" aria-hidden="true">${top}</span>`+
        `<span class="dow" aria-hidden="true">${dowLabel}</span>`+
        `<span class="stem" aria-hidden="true"></span>`+
        `</button>`;
  });
  ruler.innerHTML=rh;
  ruler.querySelectorAll(".tick").forEach(t=>t.onclick=()=>selectDay(t.dataset.day));

  const selDt=dateOf({date:state.selDate});
  const dayEvs=EVENTS.filter(e=>e.date===state.selDate&&passFilters(e)).sort((a,b)=>a.time<b.time?-1:1);
  setCount(dayEvs.length);
  const hl=heroLabel(selDt), big=hl[0], small=hl[1], isToday=hl[2];
  // while the live list is still coming in, show the skeleton — even if the baked
  // seed already has a few events for this day — so people don't see a partial list
  // (one event) jump to the full list a second later.
  const subCount = window.ZUZU_LOADING ? "Loading…"
                 : (dayEvs.length ? evN(dayEvs.length,true) : "no events");
  hero.innerHTML=`<h2 class="tlTitle">${isToday?`<span class="hot">${big}</span>`:big}</h2>`+
    `<div class="tlSub">${small} · ${subCount}</div>`;

  if(window.ZUZU_LOADING){
    list.innerHTML=loadingHtml(3);
  }else if(dayEvs.length){
    list.innerHTML=dayEvs.map(cardHtml).join("");
  }else{
    const isoDays=days.map(iso);
    const nextKey=isoDays.find(k=>k>state.selDate && dayCount(k)>0);
    list.innerHTML=nextKey
      ? `<button class="tlNext" data-next="${nextKey}">Jump to the next day with events →</button>`
      : (EVENTS.some(e=>e.date>isoDays[isoDays.length-1]&&passFilters(e))
          ? `<div class="tlEmpty">Later events are in the month view or in search.</div>`
          : `<div class="tlEmpty">No more events coming up.</div>`);
    const nb=list.querySelector(".tlNext"); if(nb) nb.onclick=()=>selectDay(nb.dataset.next);
  }
  reveal(list,".card",60,380);
  centerSelected(false);
  updateRulerNav();
}
// show the back (→) arrow only when there is somewhere to go back to:
// a later day is selected, or the ruler was scrolled away from today
function updateRulerNav(){
  const p=document.getElementById("rulerPrev"), ruler=document.getElementById("ruler"); if(!p||!ruler) return;
  const first=ruler.querySelector(".tick");
  const atStart=(!first||first.classList.contains("sel")) && Math.abs(ruler.scrollLeft)<4;

function selectDay(key){ const kb=document.activeElement&&document.activeElement.classList.contains("tick"); state.when="all"; state.selDate=key; try{track("select_day",{value:key});}catch(_e){} renderTimeline(); syncUrl(); centerSelected(true);
  if(kb){ const t=document.querySelector("#ruler .tick.sel"); if(t) t.focus({preventScroll:true}); } }
function stepDay(delta){
  const days=timelineDays().map(iso); const i=days.indexOf(state.selDate);
  const ni=Math.min(days.length-1,Math.max(0,(i<0?0:i)+delta));
  if(days[ni]) selectDay(days[ni]);
}
function centerSelected(smooth){
  const ruler=document.getElementById("ruler"); const t=ruler.querySelector(".tick.sel"); if(!t) return;
  const rRect=ruler.getBoundingClientRect(), tRect=t.getBoundingClientRect();
  const delta=(tRect.left+tRect.width/2)-(rRect.left+rRect.width/2);

}
(function wireTimeline(){
  const p=document.getElementById("rulerPrev"), n=document.getElementById("rulerNext");
  if(p) p.onclick=()=>stepDay(-1);
  if(n) n.onclick=()=>stepDay(1);

  // drag-to-scroll the ruler (pointer), suppressing the day-click after a real drag
  const ruler=document.getElementById("ruler");
  if(ruler){
    ruler.addEventListener("scroll",updateRulerNav,{passive:true});
    let down=false,moved=false,startX=0,startScroll=0,pid=null;
    ruler.addEventListener("pointerdown",e=>{
      if(e.button!==undefined&&e.button!==0) return;
      down=true;moved=false;startX=e.clientX;startScroll=ruler.scrollLeft;pid=e.pointerId;
      ruler.classList.add("grab");
    });
    ruler.addEventListener("pointermove",e=>{
      if(!down) return;
      const dx=e.clientX-startX;
      if(!moved&&Math.abs(dx)>5){ moved=true; try{ruler.setPointerCapture(pid);}catch(_e){} }
      if(moved){ ruler.scrollLeft=startScroll-dx; e.preventDefault(); }
    });
    const end=()=>{ if(!down)return; down=false; ruler.classList.remove("grab");
      if(moved){ ruler.classList.add("dragged"); setTimeout(()=>ruler.classList.remove("dragged"),0); } };
    ruler.addEventListener("pointerup",end);
    ruler.addEventListener("pointercancel",end);
    ruler.addEventListener("pointerleave",end);
    // block the synthetic click on a tick if the gesture was a drag
    ruler.addEventListener("click",e=>{ if(ruler.classList.contains("dragged")){ e.stopPropagation(); e.preventDefault(); } },true);
    // trackpad / shift-wheel horizontal scroll
    ruler.addEventListener("wheel",e=>{
      if(Math.abs(e.deltaX)>Math.abs(e.deltaY)) return; // native horizontal already handled
      ruler.scrollLeft+=e.deltaY; e.preventDefault();
    },{passive:false});
  }
  document.addEventListener("keydown",e=>{
    if(state.view!=="list"||state.q) return;
    const a=document.activeElement; if(a&&/^(input|textarea|select)$/i.test(a.tagName)) return;
    if(e.key==="ArrowRight"){ e.preventDefault(); stepDay(1); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); stepDay(-1); }
  });
})();

/* ---- shareable link: the filters live in the URL, in English (same codes on / and /en) ----
   Clean form, hyphen-joined:  /tel-aviv-gaga   /en/north-contact-jam   /this-week-ecstatic
     codes: when (today, tomorrow, this-week), area (region slug), style (family slug), event type
     (format slug / audience key), and a dance style (discipline slug, e.g. gaga), which becomes a search.
     Any other lowercase English word in the path is a search word too.
   Kept as ?query: ?q= for any other search (e.g. Hebrew names), ?day=2026-10-12 for a chosen day.
   Old links still work: ?area= ?style= ?type= ?when= ?cat= */
var urlReady=false;   // don't touch the URL until applyUrl() has read it (after the data loads)
const PAGE_BASE="/en", OTHER_BASE="";
const URL_AXES=[["area","regs"],["style","cats"],["type","fmts"]];
const URL_WHEN={tonight:"today",tomorrow:"tomorrow",week:"week"};          // old ?when= values
const PATH_WHEN={tonight:"today",tomorrow:"tomorrow",week:"this-week"};
function urlCodes(){   // per axis: code → label
  const m={regs:{},cats:{},fmts:{}};
  LOOKUPS.regions.forEach(r=>{ const l=r.name_en||r.name_he; if(r.slug&&l) m.regs[r.slug]=l; });
  LOOKUPS.families.forEach(f=>{ const l=LOOKUPS.famLabel[f.slug]; if(f.slug&&l) m.cats[f.slug]=l; });
  Object.keys(LOOKUPS.fmtLabel).forEach(k=>m.fmts[k]=LOOKUPS.fmtLabel[k]);
  Object.keys(AUDIENCE_LABELS).forEach(k=>m.fmts[k]=AUDIENCE_LABELS[k]);
  return m;
}
const toPath=c=>String(c).toLowerCase().replace(/_/g,"-");
function pathTokens(){   // path word(s) → [axis, value]. On a clash the earlier one wins (a family beats a dance style).
  const t={}, put=(k,v)=>{ if(k && !(k in t)) t[k]=v; }, m=urlCodes();
  Object.keys(PATH_WHEN).forEach(w=>put(PATH_WHEN[w],["when",w]));
  ["regs","cats","fmts"].forEach(ax=>Object.keys(m[ax]).forEach(c=>put(toPath(c),[ax,m[ax][c]])));
  Object.keys(LOOKUPS.discLabel).forEach(s=>put(toPath(s),["disc",s]));
  return t;
}
function parsePath(seg,tok){   // "tel-aviv-gaga" → [["regs","תל אביב והסביבה"],["disc","gaga"]], longest match first
  const w=seg.toLowerCase().split("-").filter(Boolean), out=[];
  for(let i=0;i<w.length;){
    let j=w.length;
    for(;j>i;j--){ const k=w.slice(i,j).join("-"); if(tok[k]){ out.push(tok[k]); break; } }
    if(j>i) i=j; else { out.push(["word",w[i]]); i++; }
  }
  return out;
}
function pathSegment(){   // the part of the path after / or /en, if it looks like ours
  const s=decodeURIComponent(location.pathname).replace(PAGE_BASE?/^\/en(\.html)?\/?/:/^\//,"");
  return /^[a-z0-9][a-z0-9-]*$/i.test(s)?s:"";
}
function searchText(){ const inp=document.getElementById("searchInput"); return inp?inp.value.trim():""; }
function setSearch(q){
  const inp=document.getElementById("searchInput"), clr=document.getElementById("searchClear");
  if(inp) inp.value=q; if(clr) clr.classList.toggle("show",q.length>0);
  state.q=q.trim().toLowerCase();
}
function applyUrl(){
  const p=new URLSearchParams(location.search), m=urlCodes(), words=[];
  const take=(ax,raw)=>String(raw||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(c=>{
    const lab=m[ax][c]||(Object.values(m[ax]).includes(c)?c:"");   // a code, or an old-style label
    if(lab) state[ax].add(lab);
  });
  parsePath(pathSegment(),pathTokens()).forEach(([ax,v])=>{
    if(ax==="when") state.when=v;
    else if(ax==="disc") words.push(LOOKUPS.discLabel[v]||v);
    else if(ax==="word") words.push(v);
    else state[ax].add(v);
  });
  URL_AXES.forEach(([k,ax])=>take(ax,p.get(k)));
  take("cats",p.get("cat"));
  const w=Object.keys(URL_WHEN).find(k=>URL_WHEN[k]===p.get("when"));
  if(w) state.when=w;
  if(state.when==="all" && /^\d{4}-\d{2}-\d{2}$/.test(p.get("day")||"")) state.selDate=p.get("day");   // a day out of range falls back to today
  const q=[...words,(p.get("q")||"").trim()].filter(Boolean).join(" ");
  if(q) setSearch(q);
  urlReady=true;
}
function searchToPath(q,tok){   // a search that can be written as English path words, or "" if it can't
  const n=q.toLowerCase();
  for(const s of Object.keys(LOOKUPS.discAll)){   // the exact name of a dance style, in Hebrew or English
    const t=toPath(s);
    if(tok[t] && tok[t][0]==="disc" && tok[t][1]===s && LOOKUPS.discAll[s].includes(n)) return t;
  }
  const words=n.split(/\s+/);
  if(words.every(x=>/^[a-z0-9]+$/.test(x)) && parsePath(words.join("-"),tok).every(([ax])=>ax==="word")) return words.join("-");
  return "";
}
function urlParts(){   // → {path:"tel-aviv-gaga", qs:"day=…"}
  const m=urlCodes(), tok=pathTokens(), parts=[], p=new URLSearchParams();
  const code=(ax,l)=>toPath(Object.keys(m[ax]).find(k=>m[ax][k]===l)||"");
  const q=searchText();
  if(state.when!=="all") parts.push(PATH_WHEN[state.when]);
  [["regs"],["cats"],["fmts"]].forEach(([ax])=>[...state[ax]].forEach(l=>{
    const c=code(ax,l); if(c && tok[c] && tok[c][0]===ax) parts.push(c);
    else p.append(URL_AXES.find(a=>a[1]===ax)[0],l);   // no code for it (shouldn't happen): keep it as a query
  }));
  if(q){ const sp=searchToPath(q,tok); if(sp) parts.push(sp); else p.set("q",q); }
  else if(state.when==="all" && state.view==="list" && state.selDate && state.selDate!==iso(TODAY)) p.set("day",state.selDate);
  return {path:parts.join("-"), qs:p.toString()};
}
function syncUrl(){
  if(!urlReady) return;
  const u=urlParts(), tail=(u.qs?"?"+u.qs:"");
  const want=(u.path?PAGE_BASE+"/"+u.path:(PAGE_BASE||"/"))+tail+location.hash;
  if(want!==location.pathname+location.search+location.hash){ try{ history.replaceState(history.state,"",want); }catch(_e){} }
  const lang=document.querySelector(".langlink");   // switching language keeps the filters
  if(lang) lang.setAttribute("href",(u.path?OTHER_BASE+"/"+u.path:(OTHER_BASE||"/"))+tail);
  const sb=document.getElementById("shareBtn"); if(sb) sb.hidden=!(u.path||u.qs);
  chipRowVis();
}
function chipRowVis(){
  const row=document.getElementById("chipRow"), sb=document.getElementById("shareBtn");
  row.hidden=!row.querySelector(".chip") && (!sb||sb.hidden);
}
function shareText(){
  const bits=[];
  const q=searchText(); if(q) bits.push("Search: "+q);
  else if(state.when!=="all") bits.push({tonight:"Today",tomorrow:"Tomorrow",week:"This week"}[state.when]);
  else if(state.view==="list" && state.selDate!==iso(TODAY)){ const d=parseIso(state.selDate); bits.push(d.getDate()+"."+(d.getMonth()+1)); }
  [...state.cats,...state.fmts,...state.regs].forEach(v=>bits.push(v));
  return "Movement & dance events on zuzu"+(bits.length?": "+bits.join(" · "):"");
}
(function wireShare(){
  const btn=document.getElementById("shareBtn"), lbl=document.getElementById("shareLbl"), sr=document.getElementById("shareSr");
  if(!btn) return;
  let tm=null;
  function copied(){
    lbl.textContent="Link copied ✓"; sr.textContent="Link copied";
    clearTimeout(tm); tm=setTimeout(()=>{ lbl.textContent="Share"; sr.textContent=""; },2200);
  }
  function copy(url){
    if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(url).then(copied,()=>fallback(url));
    fallback(url);
  }
  function fallback(url){
    const ta=document.createElement("textarea"); ta.value=url; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_e){} ta.remove(); btn.focus();
    ok?copied():window.prompt("Copy the link:",url);
  }
  btn.onclick=()=>{
    syncUrl(); const url=location.href;
    try{ track("share",{value:location.search}); }catch(_e){}
    // phone → the system share sheet (WhatsApp etc.); computer → copy the link
    const phone=window.matchMedia&&matchMedia("(pointer:coarse)").matches;
    if(phone&&navigator.share){
      navigator.share({title:"zuzu",text:shareText(),url}).catch(e=>{ if(e&&e.name!=="AbortError") copy(url); });
    } else copy(url);
  };
})();
/* ---- v2 loader: fetch lookups + events from Supabase, expand to one entry per day ---- */
function sbGet(path){
  return fetch(SB_URL+"/rest/v1/"+path,{headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}})
    .then(r=>{ if(!r.ok) throw new Error("supabase "+r.status+" "+path); return r.json(); });
}
function safeTxt(s){ return s==null?"":String(s).replace(/[<>"]/g,""); }   // data goes into innerHTML
function parseIso(s){ const [y,m,d]=String(s).slice(0,10).split("-").map(Number); return new Date(y,m-1,d); }
function hhmm(t){ return t?String(t).slice(0,5):""; }
function priceTxt(p){ const t=safeTxt(p).trim(); return /^\d+([.,]\d+)?$/.test(t)?t+" ₪":t; }   // bare numbers ("70") get a ₪
function occurrenceDates(ev){
  const out=[], start=parseIso(ev.date_start);
  const horizon=new Date(TODAY); horizon.setDate(horizon.getDate()+400);
  const wds=Array.isArray(ev.rule_weekdays)?ev.rule_weekdays.map(Number):[];
  if(wds.length){
    // weekly: rule_weekdays (0=Sunday) every rule_interval_weeks weeks from date_start
    const step=Math.max(1,Number(ev.rule_interval_weeks)||1);
    const ends=[ev.valid_until,ev.date_end].filter(Boolean).map(parseIso);
    let end=ends.length?new Date(Math.min(...ends)):new Date(TODAY.getTime()+OPEN_RULE_DAYS*864e5);
    if(end>horizon) end=horizon;
    const wk0=new Date(start); wk0.setDate(wk0.getDate()-wk0.getDay());
    const d=new Date(start), monthStart=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
    if(d<monthStart) d.setTime(monthStart.getTime());   // calendar view only needs this month onward
    for(;d<=end;d.setDate(d.getDate()+1)){
      if(!wds.includes(d.getDay())) continue;
      const wk=new Date(d); wk.setDate(wk.getDate()-wk.getDay());
      if(Math.round((wk-wk0)/(7*864e5))%step!==0) continue;
      out.push(iso(d));
    }
  }else{
    // single or multi-day: every day from date_start to date_end
    let end=ev.date_end?parseIso(ev.date_end):start;
    if(end>horizon) end=horizon;
    for(const d=new Date(start);d<=end;d.setDate(d.getDate()+1)) out.push(iso(d));
  }
  return out;
}
function mapEvent(ev,hostNames){
  const venue=ev.venue||{}, city=venue.city||{}, region=city.region||{};
  const discs=(ev.disciplines||[]).map(s=>LOOKUPS.discLabel[s]||s);
  const fams=[...new Set((ev.disciplines||[]).flatMap(s=>LOOKUPS.discFams[s]||[]))].map(f=>LOOKUPS.famLabel[f]).filter(Boolean);
  const fmts=(ev.formats||[]).map(s=>LOOKUPS.fmtLabel[s]||s);
  const hosts=(ev.event_hosts||[]).map(h=>h&&h.host&&h.host.name).filter(Boolean);
  const url=/^https?:\/\//i.test(ev.link||"")?ev.link:"";
  const base={
    id:ev.id, title:safeTxt(ev.title_en||ev.title), host:safeTxt(hosts.join(", "))||null,
    venue:safeTxt(venue.name)||(ev.location_on_registration?"Location given on sign-up":""), city:safeTxt(city.name), region:safeTxt(region.name_en||region.name_he),
    discipline:safeTxt(discs.join(", ")), tags:(ev.audience||[]).map(a=>AUDIENCE_LABELS[a]).filter(Boolean),
    format:safeTxt(fmts[0]||"Class"), _fmts:fmts.map(safeTxt), _fams:fams, _discs:(ev.disciplines||[]).slice(),
    time:hhmm(ev.time_start), timeEnd:hhmm(ev.time_end),
    url, phone:ev.phone||"", price:priceTxt(ev.price_raw)||null,
    recurring:!!(ev.rule_weekdays&&ev.rule_weekdays.length)
  };
  const skip=new Set(), override={};
  (ev.event_exceptions||[]).forEach(x=>{
    const d=String(x.on_date||"").slice(0,10); if(!d) return;
    if(x.kind==="skip") skip.add(d);
    else if(x.kind==="override" && x.override_host_id && hostNames[x.override_host_id]) override[d]=safeTxt(hostNames[x.override_host_id]);
  });
  return occurrenceDates(ev).filter(d=>!skip.has(d)).map(d=>Object.assign({},base,{date:d},override[d]?{host:override[d]}:{}));
}
function loadEvents(){
  window.ZUZU_LOADING=true; render();   // paint the skeleton immediately
  Promise.all([
    sbGet("regions?select=*&order=sort_order"),
    sbGet("disciplines?select=*"),
    sbGet("families?select=*&order=sort_order"),
    sbGet("discipline_families?select=discipline,family"),
    sbGet("formats?select=*"),
    sbGet(SB_EVENTS_Q)
  ]).then(([regions,discs,fams,dfs,fmts,events])=>{
    LOOKUPS.regions=regions; LOOKUPS.families=fams;
    discs.forEach(d=>LOOKUPS.discAll[d.slug]=[d.slug,d.label_he,d.label_en].filter(Boolean).map(x=>String(x).toLowerCase()));
    discs.forEach(d=>LOOKUPS.discLabel[d.slug]=d.label_en||d.label_he);
    fmts.forEach(f=>LOOKUPS.fmtLabel[f.slug]=f.label_en||f.label_he);
    fams.forEach(f=>LOOKUPS.famLabel[f.slug]=f.label_en||f.label_he);
    dfs.forEach(r=>{ const d=r.discipline, f=r.family; if(d&&f)(LOOKUPS.discFams[d]=LOOKUPS.discFams[d]||[]).push(f); });
    // override hosts: names for override_host_id (hosts not embedded by the events query)
    const ids=[...new Set(events.flatMap(e=>(e.event_exceptions||[]).map(x=>x.override_host_id)).filter(Boolean))];
    const hostsP=ids.length?sbGet("hosts?select=id,name&id=in.("+ids.join(",")+")").catch(()=>[]):Promise.resolve([]);
    return hostsP.then(hs=>{
      const hostNames={}; hs.forEach(h=>hostNames[h.id]=h.name);
      events.forEach(ev=>{ try{ mapEvent(ev,hostNames).forEach(e=>EVENTS.push(e)); }catch(err){ console.warn("zuzu: skipped event",ev&&ev.id,err); } });
      window.ZUZU_LOADING=false;
      buildFilterLists(); applyUrl(); refreshAll(); render();
      const co=document.getElementById("catOpts");
      if(co) co.innerHTML=Object.values(LOOKUPS.discLabel).sort((a,b)=>a.localeCompare(b,"he")).map(c=>`<option value="${c}"></option>`).join("");
    });
  }).catch(err=>{
    console.error("zuzu: load failed",err);
    window.ZUZU_LOADING=false;
    render();
    const list=document.getElementById("list");
    if(list && !list.querySelector(".card")){
      list.innerHTML=errorHtml();
      const rb=document.getElementById("zRetry"); if(rb) rb.onclick=loadEvents;
    }
  });
}
refreshAll();
loadEvents();
</script>
